[package]
name = "mdpp-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "把 Markdown++ 渲染成 HTML 的命令行工具"
publish = false

[[bin]]
name = "mdpp"
path = "src/main.rs"

[dependencies]
mdpp = { path = "../mdpp" }

[dev-dependencies]
# 集成测试里要造临时目录。正经的库功能一个都不用它 ——
# 这条依赖只属于测试，而它写在 dev-dependencies 里就是这件事的记录。
tempfile = "3"