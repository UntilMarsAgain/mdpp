# mdpp —— 把 Markdown++ 渲染成 HTML（命令行）
#
# 这个包是**库的一个普通使用者**：能用库的东西只有 `use mdpp::…`，也就是它的公开
# API 那圈。它也是唯一带 `tracing-subscriber` 的那个 —— 只用库的人不必把它解出来。

[package]
name = "mdpp-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "把 Markdown++ 渲染成 HTML 的命令行工具"
keywords = ["markdown", "html", "cmark", "cli"]
categories = ["command-line-utilities", "text-processing"]
# 不发布：这个包只有跟着库走才有意义，它 `path` 依赖库、同时声明了 `version`，
# 库一改这里就得跟着改。想装就 `cargo install --path mdpp-cli`。
publish = false

[[bin]]
name = "mdpp"          # 程序名跟库的包名一样
path = "src/main.rs"
# 不为这个二进制生成文档：它没有对外的接口，而 `cargo doc` 会为库与它各写一份
# `mdpp/index.html`，后写的盖掉先写的。
doc = false

[dependencies]
# 本地开发走 `path`，发布走 `version` —— 两个都写是 cargo 的正规写法。
mdpp = { path = "../mdpp", version = "0.1.0" }

# 订阅器。库只发不装，装给谁、什么格式、过滤到哪一档都是使用方的事。
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# 门面（发日志用的宏）。它是 `tracing-subscriber` 的对接口，两个得一起写。
# 库那边也列了 `tracing`，两个包各写各的；库没有 `pub use tracing;`，
# 那会替使用方决定了「你也用这一套」。
tracing = "0.1"

clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# 只有这个包的测试用它造临时目录。库那边一个都不用 —— 它跟着使用者走。
tempfile = "3"
