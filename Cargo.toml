# mdpp 的 workspace 根。
#
# 这里**只有 [workspace]，没有 [package]**：库在 `mdpp/`，二进制在 `mdpp-cli/`，
# 各自一份完整清单。根上唯一共用的是 `[profile]` —— cargo 的 profile 只认 workspace
# 根，写在 member 的清单里会被忽略并警告一次。

[workspace]
members = ["mdpp", "mdpp-cli"]
resolver = "2"

# 库产物不带符号表、panic 时直接停。`lto` 保持 `"thin"`：跨 crate 的块分发是间接
# 调用，全量 LTO 在这里收益很小，编译时间的代价却是实打实的。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true