# mdpp —— Markdown++（库）
#
# `markdown → HTML`。这一层**不知道文件系统、终端、仓库的任何事**：目标存不存在、
# 模板页正文从哪来、正文写到哪去一概不问，那些由使用方通过 trait 递进来
# （`LinkResolver` 与 `TemplateSource`）。二进制是另一个包（`mdpp-cli`）。

[package]
name = "mdpp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Markdown++ —— markdown-it 之上的可扩展块级语法与链接解析库"
repository = "https://github.com/UntilMarsAgain/mdpp"
homepage = "https://github.com/UntilMarsAgain/mdpp"
keywords = ["markdown", "html", "markdown-it", "parser"]
categories = ["text-processing", "template-engine"]

[lib]
# target 名与包名相同，库里的路径就是 `mdpp::Mdpp`。
name = "mdpp"
path = "src/lib.rs"

[dependencies]
# 日志门面。`tracing` 本身没有依赖，带实现的是 `tracing-subscriber`，而那一条在
# `mdpp-cli` 那边 —— 只用库的人不必把它解出来。库这一侧只 `debug!` / `trace!`，
# 订阅器由使用方装。
tracing = "0.1"

# HTML 文本/属性转义。不要自己写实体表。
html-escape = "0.2"

# 标准库模板在编译期嵌进库：运行时不碰文件系统。
include_dir = "0.7.4"

# 正文解析。关掉默认 features：里面带 `syntect`，它把代码高亮配色以内联 style
# 写死，跟随不了主题。
markdown-it = { version = "0.6", default-features = false, features = ["linkify"] }

# HTML 解析树。净化器（ammonia）与类型判定都用它；`add_noopener` 还要在树上改
# `rel` 再序列化，所以不能只经由 ammonia。
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"

# `::html` 的净化器：白名单由本 crate 给，解析、重建、转义、属性过滤交给它。
# 它自带 html5ever 0.40，与上面判定用的 0.39 并存（两套解析器互不干扰）。
ammonia = { version = "4.2", default-features = false }

[dev-dependencies]
# 只有 `standalone_page` 那个例子用它写文件出去，所以是 dev-dependencies。
tempfile = "3"
