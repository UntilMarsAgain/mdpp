# mdpp —— Markdown++（库）
#
# `markdown → HTML`。这一层**不知道文件系统、终端、仓库的任何事**：目标存不存在、
# 模板页正文从哪来、正文写到哪去一概不问，那些由使用方通过 trait 递进来
# （`LinkResolver` 与 `TemplateSource`）。二进制是另一个包（`mdpp-cli`）。

[package]
name = "mdpp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Markdown++ —— markdown-it 之上的可扩展块级语法与链接解析库"
keywords = ["markdown", "html", "markdown-it", "parser"]
categories = ["text-processing", "template-engine"]

[lib]
# target 名与包名相同，库里的路径就是 `mdpp::Mdpp`。
name = "mdpp"
path = "src/lib.rs"

[dependencies]
# 日志门面。`tracing` 本身没有依赖，带实现的是 `tracing-subscriber`，而那一条在
# `mdpp-cli` 那边 —— 只用库的人不必把它解出来。库这一侧只 `debug!` / `trace!`，
# 订阅器由使用方装。
tracing = "0.1"

# 正文解析。关掉默认 features：里面带 `syntect`，它把代码高亮配色以内联 style
# 写死，跟随不了主题。
markdown-it = { version = "0.6", default-features = false, features = ["linkify"] }

# `::html` 的净化器：按 HTML5 规范解析后按白名单重建。
# 与 markdown-it 的渲染器无关（它输出原始 HTML），所以这是本 crate 里仅剩的
# 「自己动手拼 HTML」的地方 —— 拼之前必须先按规范解析一遍，否则白名单就是一句空话。
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"

[dev-dependencies]
# 只有 `standalone_page` 那个例子用它写文件出去，所以是 dev-dependencies。
tempfile = "3"